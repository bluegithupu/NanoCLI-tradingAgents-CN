[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanocli-tradingagents-cn"
version = "0.1.0"
description = "Nano CLI for A-share TradingAgents analysis"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "akshare>=1.17.86",
    "langgraph>=0.4.8",
    "openai>=1.0.0,<2.0.0",
    "pandas>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
tushare = ["tushare>=1.4.21"]

[project.scripts]
nano-trading = "nano_tradingagents.cli:app"

[tool.setuptools.packages.find]
include = ["nano_tradingagents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
